<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Tracepad</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="tp-navbar">
        <a class="tp-brand" href="index.html">
            <svg class="tp-brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            Tracepad
        </a>
        <div class="tp-nav-links">
            <a class="tp-nav-link" href="index.html">Home</a>
            <button class="tp-theme-toggle" type="button" onclick="toggleTheme()"></button>
        </div>
    </nav>

    <main class="tp-auth-wrap">
        <form class="tp-auth-card" id="authForm">
            <h1 id="authTitle">Log in</h1>
            <p class="tp-auth-error" id="authError" hidden></p>

            <button class="tp-btn tp-btn-google tp-btn-full" id="googleBtn" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Continue with Google
            </button>

            <div class="tp-auth-divider">Or with email</div>

            <label class="tp-label" for="emailInput">Email address</label>
            <input class="tp-input" id="emailInput" type="email" required autocomplete="email" placeholder="you@example.com">

            <label class="tp-label" for="passwordInput">Password</label>
            <input class="tp-input" id="passwordInput" type="password" required autocomplete="current-password" minlength="6" placeholder="••••••••">

            <div style="text-align: right; margin-top: 0.4rem;">
                <button class="tp-link-btn" id="forgotPassBtn" type="button">Forgot password?</button>
            </div>

            <button class="tp-btn tp-btn-primary tp-btn-full" id="submitBtn" type="submit" style="margin-top: 1rem;">Log in</button>

            <p class="tp-auth-toggle">
                <span id="toggleText">Don't have an account?</span>
                <button class="tp-link-btn" id="toggleModeBtn" type="button">Create one</button>
            </p>
        </form>
    </main>

    <!-- Forgot Password Modal -->
    <div class="tp-modal-backdrop" id="resetModal">
        <div class="tp-modal">
            <h3 style="margin-top: 0; font-size: 1.2rem;">Reset your password</h3>
            <p style="color: var(--ink-soft); font-size: 0.9rem;">Enter your account email and we'll send a password reset link.</p>
            <input class="tp-input" id="resetEmailInput" type="email" placeholder="you@example.com">
            <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.25rem;">
                <button class="tp-btn tp-btn-ghost" id="cancelResetBtn" type="button">Cancel</button>
                <button class="tp-btn tp-btn-primary" id="sendResetBtn" type="button">Send Link</button>
            </div>
        </div>
    </div>

    <div class="tp-toast-container" id="toastContainer"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        redirectIfSignedIn();

        let mode = "login";

        const authForm = document.getElementById("authForm");
        const authTitle = document.getElementById("authTitle");
        const authError = document.getElementById("authError");
        const submitBtn = document.getElementById("submitBtn");
        const googleBtn = document.getElementById("googleBtn");
        const toggleModeBtn = document.getElementById("toggleModeBtn");
        const toggleText = document.getElementById("toggleText");
        const forgotPassBtn = document.getElementById("forgotPassBtn");
        const resetModal = document.getElementById("resetModal");
        const cancelResetBtn = document.getElementById("cancelResetBtn");
        const sendResetBtn = document.getElementById("sendResetBtn");
        const resetEmailInput = document.getElementById("resetEmailInput");

        toggleModeBtn.addEventListener("click", function () {
            mode = mode === "login" ? "signup" : "login";
            authError.hidden = true;
            if (mode === "signup") {
                authTitle.textContent = "Create your account";
                submitBtn.textContent = "Create account";
                toggleText.textContent = "Already have an account?";
                toggleModeBtn.textContent = "Log in";
            } else {
                authTitle.textContent = "Log in";
                submitBtn.textContent = "Log in";
                toggleText.textContent = "Don't have an account?";
                toggleModeBtn.textContent = "Create one";
            }
        });

        googleBtn.addEventListener("click", function () {
            authError.hidden = true;
            logInWithGoogle()
                .then(() => window.location.href = "notes.html")
                .catch(err => {
                    authError.textContent = err.message;
                    authError.hidden = false;
                });
        });

        authForm.addEventListener("submit", function (e) {
            e.preventDefault();
            const email = document.getElementById("emailInput").value.trim();
            const password = document.getElementById("passwordInput").value;

            authError.hidden = true;
            submitBtn.disabled = true;

            const action = mode === "login" ? logIn(email, password) : signUp(email, password);

            action
                .then(function () {
                    window.location.href = "notes.html";
                })
                .catch(function (err) {
                    authError.textContent = err.message;
                    authError.hidden = false;
                    submitBtn.disabled = false;
                });
        });

        forgotPassBtn.addEventListener("click", function () {
            resetEmailInput.value = document.getElementById("emailInput").value.trim();
            resetModal.classList.add("active");
        });

        cancelResetBtn.addEventListener("click", function () {
            resetModal.classList.remove("active");
        });

        sendResetBtn.addEventListener("click", function () {
            const email = resetEmailInput.value.trim();
            if (!email) return;
            resetPassword(email)
                .then(function () {
                    resetModal.classList.remove("active");
                    const toast = document.createElement("div");
                    toast.className = "tp-toast tp-toast-success";
                    toast.textContent = "Password reset email sent!";
                    document.getElementById("toastContainer").appendChild(toast);
                    setTimeout(() => toast.remove(), 3500);
                })
                .catch(function (err) {
                    alert(err.message);
                });
        });
    </script>
</body>

</html>
